name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check environment
        run: ./scripts/check-environment.sh
      - name: Build CLI
        run: swift build -c release
      # Do not download Wine or GPTK on CI. Do not upload Libraries.tar.gz.
